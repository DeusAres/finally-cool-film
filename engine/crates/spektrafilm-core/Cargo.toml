[package]
name = "spektrafilm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
precision-f64 = [
    "spektrafilm-math/precision-f64",
    "spektrafilm-gpu/precision-f64",
    "spektrafilm-model/precision-f64",
]

[dependencies]
web-time = "1"
spektrafilm-math.workspace = true
spektrafilm-gpu.workspace = true
spektrafilm-model.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true
libm.workspace = true
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cblas = "0.4"
blas-src = { version = "0.10", features = ["accelerate"] }

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows"), not(target_arch = "wasm32")))'.dependencies]
cblas = "0.4"
blas-src = { version = "0.10", features = ["openblas"] }

[dev-dependencies]
# The GPU-resident parity tests (filming.rs, mallett.rs) need the wgpu backend, off in the workspace dependency
# (default-features = false): without it `cargo test -p spektrafilm-core` did not compile (4.43). They skip without an adapter.
spektrafilm-gpu = { workspace = true, features = ["wgpu-backend"] }
