[workspace]
resolver = "2"
members = [
    "crates/spektrafilm-core",
    "crates/spektrafilm-eval",
    "crates/spektrafilm-gpu",
    "crates/spektrafilm-math",
    "crates/spektrafilm-model",
    "crates/spektrafilm-wasm",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "GPL-3.0"
rust-version = "1.85"

[workspace.dependencies]
spektrafilm-core = { path = "crates/spektrafilm-core" }
spektrafilm-gpu = { path = "crates/spektrafilm-gpu", default-features = false }
spektrafilm-math = { path = "crates/spektrafilm-math" }
spektrafilm-model = { path = "crates/spektrafilm-model" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
rand = "0.9"
rand_distr = "0.5"
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
wgpu = { version = "24", default-features = false, features = ["wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }
tracing = "0.1"
thiserror = "2"
byteorder = "1"
libm = "0.2"
rustfft = "6"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
