<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0d0c">
<title>finally cool film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0d0c; --fg: #efe9e1; --muted: #8f877d; --accent: #e8a33d; --line: #2a2622; --card: #171513; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
         font: 15px/1.35 -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 30px; padding: 0 12px; flex: none;
         font-family: "Silkscreen", "Press Start 2P", ui-monospace, Menlo, monospace; }
  header h1 { font: 400 13px/1 "Silkscreen", ui-monospace, Menlo, monospace; margin: 0; letter-spacing: .04em; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .ver { font: 400 10px/1 "Silkscreen", ui-monospace, Menlo, monospace; color: var(--muted); letter-spacing: 0; white-space: nowrap; }
  .btn { background: var(--accent); color: #1a1208; border: 0; border-radius: 999px; padding: 9px 16px;
         font: 600 15px system-ui; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .btn:disabled { opacity: .35; }
  input[type=file] { display: none; }

  /* Stage: canvas centred, zoom/pan purely via CSS transform (the stage never scrolls). */
  #stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #view { display: none; flex: none; transform-origin: center center; will-change: transform; }
  /* Dust layer: same size and transform as #view; an abs-pos flex child is centred like it. */
  #dustLayer { position: absolute; display: none; transform-origin: center center; will-change: transform; pointer-events: none; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 12px; color: var(--muted); text-align: center; padding: 16px; }
  #empty .btn { font-size: 17px; padding: 14px 24px; }
  .overlay { position: absolute; z-index: 2; }
  #tools { bottom: 10px; right: 12px; display: flex; gap: 6px; }
  #tools[hidden] { display: none; }
  .chip { background: #000b; color: var(--fg); border: 1px solid #fff3; border-radius: 999px; padding: 7px 12px;
         font: 600 13px system-ui; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; }
  #badge { top: 10px; left: 50%; transform: translateX(-50%); background: #000b; padding: 3px 10px;
         border-radius: 6px; font-size: 12px; display: none; }
  #zoomLabel { bottom: 16px; left: 14px; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }

  /* Compact scrollable strip: the photo gets most of the screen. */
  #grip { flex: none; height: 22px; display: flex; align-items: center; justify-content: center; background: var(--card);
         border-top: 1px solid var(--line); touch-action: none; cursor: ns-resize; user-select: none; -webkit-user-select: none; }
  #grip span { width: 40px; height: 5px; border-radius: 3px; background: #5a534b; }
  #grip.drag span { background: var(--accent); }
  #controls { flex: none; height: 18vh; min-height: 0; padding: 0 16px 4px;
         background: var(--card); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
         touch-action: pan-y; }
  .row { display: grid; grid-template-columns: 92px 1fr 44px; align-items: center; gap: 8px; min-height: 34px; }
  .row.check { grid-template-columns: 1fr; }
  .row.check label { display: flex; align-items: center; gap: 8px; color: var(--fg); }
  .row.check input { accent-color: var(--accent); width: 18px; height: 18px; }
  .section { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
         padding: 8px 0 2px; }
  .row label { font-size: 14px; color: var(--muted); }
  .row output { font: 12px ui-monospace, Menlo, monospace; text-align: right; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .filebtns { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 4px 0 6px; }
  .filebtns .btn { border-radius: 14px; padding: 10px 8px; font-size: 16px; min-height: 46px; }
  .filebtns .btn[hidden] { display: none; }
  .row2 { display: flex; gap: 10px; }
  .row2 .btn { flex: 1; }
  .filebtns .wide { grid-column: 1 / -1; }
  .pane[hidden] { display: none; }
  .pane { padding-top: 4px; }
  #tabs { flex: none; display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 0 4px; }
  #tabs button { flex: 1; background: none; border: 0; color: var(--muted); padding: 6px 0 4px; display: flex; flex-direction: column;
         align-items: center; gap: 2px; font: 500 10px system-ui; cursor: pointer; min-width: 0; }
  #tabs button[aria-selected=true] { color: var(--accent); }
  #status { flex: none; font-size: 12px; color: var(--muted); padding: 3px 16px 6px; min-height: 20px; white-space: nowrap;
         overflow: hidden; text-overflow: ellipsis; background: var(--card); }
  #histo { top: 8px; left: 8px; width: 128px; height: 56px; background: #000a; border-radius: 6px;
         pointer-events: none; display: none; }

  #logPanel { display: none; position: fixed; inset: 0; z-index: 10; background: #000e;
         padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
         flex-direction: column; gap: 8px; }
  #logPanel pre { flex: 1; overflow: auto; margin: 0; font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap;
         word-break: break-word; background: var(--card); padding: 8px; border-radius: 8px; }
  #logPanel .bar { display: flex; gap: 8px; }
  #logPanel .bar .btn { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>finally cool film</h1>
  <span class="ver" id="ver"></span>
</header>

<div id="stage">
  <div id="wrap"><canvas id="view"></canvas><canvas id="dustLayer"></canvas></div>
  <div id="empty">
    <label class="btn">Scegli foto<input type="file" id="pick" accept="image/*,.dng,image/x-adobe-dng"></label>
    <div>Pizzica per zoomare · trascina per spostarti<br>tieni premuto “A/B” per l’originale</div>
  </div>
  <div class="overlay" id="tools" hidden>
    <span class="chip" id="compare">A/B</span>
    <span class="chip" id="fit">Adatta</span>
  </div>
  <canvas class="overlay" id="histo" width="256" height="112"></canvas>
  <div class="overlay" id="badge">ORIGINALE</div>
  <div class="overlay" id="zoomLabel"></div>
</div>

<div id="grip" title="Trascina per ridimensionare"><span></span></div>
<div id="controls">
  <div class="pane" data-pane="file" role="tabpanel">
  <div class="filebtns">
    <button class="btn wide" id="newPhoto">Carica foto</button>
    <div class="wide row2">
      <button class="btn ghost" id="auto" disabled>Auto</button>
      <button class="btn" id="export" disabled>Esporta</button>
      <button class="btn ghost" id="exportIG" disabled hidden>IG</button>
    </div>
  </div>
  </div>
  <div class="pane" data-pane="light" role="tabpanel" hidden>
  <div class="row"><label for="ev">Esposizione</label><input type="range" id="ev" min="-2" max="2.5" step="0.1" value="0"><output for="ev"></output></div>
  <div class="row"><label for="contrast">Contrasto</label><input type="range" id="contrast" min="-1" max="1" step="0.01" value="0"><output for="contrast"></output></div>
  <div class="row"><label for="highlight">Alte luci</label><input type="range" id="highlight" min="-1" max="1" step="0.01" value="0"><output for="highlight"></output></div>
  <div class="row"><label for="black">Nero</label><input type="range" id="black" min="0" max="1" step="0.01" value="0"><output for="black"></output></div>
  <div class="row check"><label><input type="checkbox" id="indoor"> Interno / luce scarsa (negativo sottile)</label></div>
  </div>
  <div class="pane" data-pane="color" role="tabpanel" hidden>
  <div class="row"><label for="mshift">Magenta ↔ Verde</label><input type="range" id="mshift" min="-30" max="30" step="1" value="0"><output for="mshift"></output></div>
  <div class="row"><label for="yshift">Giallo ↔ Blu</label><input type="range" id="yshift" min="-30" max="30" step="1" value="0"><output for="yshift"></output></div>
  </div>
  <div class="pane" data-pane="film" role="tabpanel" hidden>
  <div class="row"><label for="grain">Grana</label><input type="range" id="grain" min="0" max="3" step="0.1" value="0.4"><output for="grain"></output></div>
  <div class="row"><label for="halation">Halation</label><input type="range" id="halation" min="0" max="3" step="0.1" value="1"><output for="halation"></output></div>
  <div class="row"><label for="texture">Texture</label><input type="range" id="texture" min="-1" max="1" step="0.01" value="0.2"><output for="texture"></output></div>
  <div class="row"><label for="clarity">Chiarezza</label><input type="range" id="clarity" min="0" max="1" step="0.01" value="0.1"><output for="clarity"></output></div>
  </div>
  <div class="pane" data-pane="optics" role="tabpanel" hidden>
  <div class="row"><label for="ca">Aberrazione</label><input type="range" id="ca" min="0" max="1" step="0.01" value="1"><output for="ca"></output></div>
  <div class="row"><label for="vignette">Vignettatura</label><input type="range" id="vignette" min="0" max="1" step="0.01" value="0.65"><output for="vignette"></output></div>
  <div class="row"><label for="falloff">Falloff</label><input type="range" id="falloff" min="0" max="1" step="0.01" value="0.4"><output for="falloff"></output></div>
  </div>
  <div class="pane" data-pane="dust" role="tabpanel" hidden>
  <div class="row"><label for="dust">Quantità</label><input type="range" id="dust" min="0" max="1" step="0.01" value="0.27"><output for="dust"></output></div>
  <div class="row check"><label><span class="chip" id="reseed">Rimescola</span></label></div>
  <div class="row check"><label><input type="checkbox" id="border" checked> Bordo bianco (1% del lato lungo)</label></div>
  </div>
</div>
<nav id="tabs" role="tablist">
  <button type="button" role="tab" data-tab="file" aria-selected="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5a2 2 0 0 1 2-2h4.2l2 2.5H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 17v-6M9.5 13.5L12 11l2.5 2.5"/></svg><span>File</span></button>
  <button type="button" role="tab" data-tab="light" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><span>Luce</span></button>
  <button type="button" role="tab" data-tab="color" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2c3.6 4.2 6 7.2 6 10.3a6 6 0 0 1-12 0c0-3.1 2.4-6.1 6-10.300z"/><path d="M9 14a3 3 0 0 0 2.5 2.9"/></svg><span>Colore</span></button>
  <button type="button" role="tab" data-tab="film" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M4 7h16M4 17h16M8 2.500v19M16 2.500v19"/></svg><span>Pellicola</span></button>
  <button type="button" role="tab" data-tab="optics" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M15.5 8.500l1.2-1.2"/></svg><span>Ottica</span></button>
  <button type="button" role="tab" data-tab="dust" aria-selected="false"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.200L19 10l-5.2 1.800L12 17l-1.8-5.200L5 10l5.2-1.800z"/><circle cx="18.5" cy="17.5" r="1"/><circle cx="5.5" cy="18" r=".8"/></svg><span>Polvere</span></button>
</nav>
<div id="status">Caricamento motore…</div>

<div id="logPanel">
  <strong id="logTitle">Log</strong>
  <pre id="logText"></pre>
  <div class="bar">
    <button class="btn" id="logCopy">Copia log</button>
    <button class="btn ghost" id="logClose">Chiudi</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
